name: Deploy to GitHub Pages

# The default branch is the only source of the live site. Every push to it
# deploys, and live-data.yml calls this workflow after it commits new FX rates
# (pushes made with GITHUB_TOKEN do not trigger the push event).
on:
  push:
    branches: ["claude/new-session-4252nf"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Branch head rather than the triggering SHA, so a deploy called right
          # after the FX commit ships that commit.
          ref: ${{ github.ref }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
